name: Publish to npm

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm 11.5+ (node 20 ships npm 10). Pin to
      # npm@11 explicitly: npm@latest is now v12, which requires node 22+ and
      # fails on this node-20 runner. npm 11 runs on node ^20.17 and supports
      # trusted publishing + --provenance.
      - run: npm install -g npm@11

      - run: npm ci

      - run: npm run build

      # --provenance emits the signed provenance statement n8n Cloud
      # verification requires (a node published without it fails
      # @n8n/scan-community-package). id-token: write above enables it.
      - run: npm publish --access public --provenance
